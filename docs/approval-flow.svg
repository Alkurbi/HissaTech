<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1752" viewBox="0 0 1600 1752" role="img" aria-labelledby="title description"><title id="title">Approval and verified execution</title><desc id="description">Separate from request generation. Execution is a local SQLite operation inside Store, not an external Zoho call.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#566272"/></marker></defs><rect width="1600" height="1752" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#202936}.title{font-size:30px;font-weight:700}.heading{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#566272}.mono{font-family:Consolas,monospace;font-size:15px}</style><text x="44" y="48" class="title"><tspan x="44" dy="0">Approval and verified execution</tspan></text><text x="44" y="84" class="small"><tspan x="44" dy="0">Separate from request generation. Execution is a local SQLite operation inside Store, not an external Zoho call.</tspan></text><rect x="25" y="140" width="190" height="110" rx="9" fill="#f1f3f5" stroke="#596574" stroke-width="2"/><text x="43" y="170" class="heading"><tspan x="43" dy="0">Ops / interface</tspan></text><text x="43" y="205" class="body"><tspan x="43" dy="0"></tspan></text><line x1="120.0" y1="250" x2="120.0" y2="1607" stroke="#b3bdc9" stroke-dasharray="6 6"/><rect x="478" y="140" width="190" height="110" rx="9" fill="#f1f3f5" stroke="#596574" stroke-width="2"/><text x="496" y="170" class="heading"><tspan x="496" dy="0">service.py</tspan></text><text x="496" y="205" class="body"><tspan x="496" dy="0"></tspan></text><line x1="573.3333333333333" y1="250" x2="573.3333333333333" y2="1607" stroke="#b3bdc9" stroke-dasharray="6 6"/><rect x="931" y="140" width="190" height="110" rx="9" fill="#f1f3f5" stroke="#596574" stroke-width="2"/><text x="949" y="170" class="heading"><tspan x="949" dy="0">Store</tspan></text><text x="949" y="205" class="body"><tspan x="949" dy="0"></tspan></text><line x1="1026.6666666666665" y1="250" x2="1026.6666666666665" y2="1607" stroke="#b3bdc9" stroke-dasharray="6 6"/><rect x="1385" y="140" width="190" height="110" rx="9" fill="#f1f3f5" stroke="#596574" stroke-width="2"/><text x="1403" y="170" class="heading"><tspan x="1403" dy="0">SQLite</tspan></text><text x="1403" y="205" class="body"><tspan x="1403" dy="0"></tspan></text><line x1="1480.0" y1="250" x2="1480.0" y2="1607" stroke="#b3bdc9" stroke-dasharray="6 6"/><polyline points="120.0,300 573.3333333333333,300" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="130.0" y="272" class="small"><tspan x="130.0" dy="0">1. inspect_proposal(id, trusted role)</tspan></text><polyline points="573.3333333333333,382 1026.6666666666665,382" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="583.3333333333333" y="354" class="small"><tspan x="583.3333333333333" dy="0">2. inspect(id): verify canonical payload + hash</tspan></text><polyline points="1026.6666666666665,464 120.0,464" fill="none" stroke="#566272" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="130.0" y="436" class="small"><tspan x="130.0" dy="0">3. Exact persisted payload, status, decision</tspan></text><polyline points="120.0,546 573.3333333333333,546" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="130.0" y="518" class="small"><tspan x="130.0" dy="0">4. decide_proposal(id, hash, approve, actor)</tspan></text><polyline points="573.3333333333333,628 1026.6666666666665,628" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="583.3333333333333" y="600" class="small"><tspan x="583.3333333333333" dy="0">5. approve_and_execute: check Ops and mode</tspan></text><polyline points="1026.6666666666665,710 1480.0,710" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="1036.6666666666665" y="682" class="small"><tspan x="1036.6666666666665" dy="0">6. BEGIN IMMEDIATE; verify proposal hash</tspan></text><polyline points="1026.6666666666665,792 1480.0,792" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="1036.6666666666665" y="764" class="small"><tspan x="1036.6666666666665" dy="0">7. Insert immutable approval; status approved; COMMIT</tspan></text><polyline points="1026.6666666666665,874 1101.6666666666665,874 1101.6666666666665,899 1026.6666666666665,899" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="1111.6666666666665" y="854" class="small"><tspan x="1111.6666666666665" dy="0">8. execute(id, mode)</tspan></text><polyline points="1026.6666666666665,956 1480.0,956" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="1036.6666666666665" y="928" class="small"><tspan x="1036.6666666666665" dy="0">9. New transaction; recheck persisted approval</tspan></text><polyline points="1026.6666666666665,1038 1480.0,1038" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="1036.6666666666665" y="1010" class="small"><tspan x="1036.6666666666665" dy="0">10. Reconcile existing action OR create local action</tspan></text><polyline points="1026.6666666666665,1120 1480.0,1120" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="1036.6666666666665" y="1092" class="small"><tspan x="1036.6666666666665" dy="0">11. Record attempt; mark success; COMMIT</tspan></text><polyline points="1026.6666666666665,1202 573.3333333333333,1202" fill="none" stroke="#566272" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="583.3333333333333" y="1174" class="small"><tspan x="583.3333333333333" dy="0">12. Verified outcome, action ID and payload</tspan></text><polyline points="573.3333333333333,1284 120.0,1284" fill="none" stroke="#566272" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="130.0" y="1256" class="small"><tspan x="130.0" dy="0">13. Current outcome, distinct from old request response</tspan></text><polyline points="120.0,1366 573.3333333333333,1366" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="130.0" y="1338" class="small"><tspan x="130.0" dy="0">14. Repeat approval after process restart</tspan></text><polyline points="573.3333333333333,1448 1026.6666666666665,1448" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="583.3333333333333" y="1420" class="small"><tspan x="583.3333333333333" dy="0">15. Same proposal ID and hash</tspan></text><polyline points="1026.6666666666665,1530 120.0,1530" fill="none" stroke="#566272" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="130.0" y="1502" class="small"><tspan x="130.0" dy="0">16. Same terminal outcome; no duplicate action</tspan></text><text x="44" y="1642" class="small"><tspan x="44" dy="0">Reject instead: store rejected status + reviewer decision, create no action. Wrong role / mismatched hash: deny with no approval or execution.</tspan></text><rect x="44" y="1687" width="12" height="12" fill="#eaf2ff" stroke="#2458a6"/><text x="63" y="1699" class="small"><tspan x="63" dy="0">Code / fixed rules</tspan></text><rect x="296" y="1687" width="12" height="12" fill="#f2eaff" stroke="#7040a0"/><text x="315" y="1699" class="small"><tspan x="315" dy="0">Local model</tspan></text><rect x="548" y="1687" width="12" height="12" fill="#fff4da" stroke="#865b08"/><text x="567" y="1699" class="small"><tspan x="567" dy="0">Text heuristics</tspan></text><rect x="800" y="1687" width="12" height="12" fill="#e8f5ee" stroke="#24704a"/><text x="819" y="1699" class="small"><tspan x="819" dy="0">Stored / calculated</tspan></text><rect x="1052" y="1687" width="12" height="12" fill="#ffebed" stroke="#a3252b"/><text x="1071" y="1699" class="small"><tspan x="1071" dy="0">Denied / error</tspan></text><rect x="1304" y="1687" width="12" height="12" fill="#f1f3f5" stroke="#596574"/><text x="1323" y="1699" class="small"><tspan x="1323" dy="0">Actor / external</tspan></text><text x="44" y="1732" class="small"><tspan x="44" dy="0">Current implementation, October 5. Mock actions only. Arrows mean the relationship stated on this page, not autonomous tool use.</tspan></text></svg>