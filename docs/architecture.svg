<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130" role="img" aria-labelledby="title description"><title id="title">System architecture</title><desc id="description">A component-style view of real Python modules. A module rectangle does not imply a class or separate process.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#566272"/></marker></defs><rect width="1400" height="1130" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#202936}.title{font-size:30px;font-weight:700}.heading{font-size:19px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#566272}.mono{font-family:Consolas,monospace;font-size:15px}</style><text x="44" y="48" class="title"><tspan x="44" dy="0">System architecture</tspan></text><text x="44" y="84" class="small"><tspan x="44" dy="0">A component-style view of real Python modules. A module rectangle does not imply a class or separate process.</tspan></text><rect x="44" y="150" width="360" height="210" rx="9" fill="#eaf2ff" stroke="#2458a6" stroke-width="2"/><text x="62" y="180" class="heading"><tspan x="62" dy="0">cli.py / __main__.py</tspan></text><text x="62" y="215" class="body"><tspan x="62" dy="0">Argparse input and JSON output.</tspan><tspan x="62" dy="23">python -m hissatech</tspan><tspan x="62" dy="23">Build validated Request.</tspan></text><rect x="500" y="150" width="390" height="210" rx="9" fill="#eaf2ff" stroke="#2458a6" stroke-width="2"/><text x="518" y="180" class="heading"><tspan x="518" dy="0">web.py + static/</tspan></text><text x="518" y="215" class="body"><tspan x="518" dy="0">Loopback HTTP; browser UI.</tspan><tspan x="518" dy="23">Explicit demo identity headers.</tspan><tspan x="518" dy="23">HTML, CSS and JavaScript.</tspan></text><rect x="1020" y="150" width="335" height="210" rx="9" fill="#eaf2ff" stroke="#2458a6" stroke-width="2"/><text x="1038" y="180" class="heading"><tspan x="1038" dy="0">domain.py</tspan></text><text x="1038" y="215" class="body"><tspan x="1038" dy="0">Request / Response contracts.</tspan><tspan x="1038" dy="23">Roles, canonical JSON and digest.</tspan><tspan x="1038" dy="23">Shared by several modules.</tspan></text><rect x="500" y="455" width="390" height="230" rx="9" fill="#eaf2ff" stroke="#2458a6" stroke-width="2"/><text x="518" y="485" class="heading"><tspan x="518" dy="0">service.py</tspan></text><text x="518" y="520" class="body"><tspan x="518" dy="0">submit_request -&gt; handle_request.</tspan><tspan x="518" dy="23">Identity, cache, lease and scope.</tspan><tspan x="518" dy="23">Model route, role check, dispatch.</tspan><tspan x="518" dy="23">Reviewer and history functions.</tspan></text><rect x="44" y="455" width="360" height="230" rx="9" fill="#fff4da" stroke="#865b08" stroke-width="2"/><text x="62" y="485" class="heading"><tspan x="62" dy="0">policies.py</tspan></text><text x="62" y="520" class="body"><tspan x="62" dy="0">Scope and content restrictions.</tspan><tspan x="62" dy="23">Draft claim screening.</tspan><tspan x="62" dy="23">Unicode normalization.</tspan><tspan x="62" dy="23">Pattern screening is heuristic.</tspan></text><rect x="1020" y="455" width="335" height="230" rx="9" fill="#e8f5ee" stroke="#24704a" stroke-width="2"/><text x="1038" y="485" class="heading"><tspan x="1038" dy="0">store.py</tspan></text><text x="1038" y="520" class="body"><tspan x="1038" dy="0">SQLite request/proposal</tspan><tspan x="1038" dy="23">lifecycle.</tspan><tspan x="1038" dy="23">Immutable approvals and actions.</tspan><tspan x="1038" dy="23">Local mock execution is HERE,</tspan><tspan x="1038" dy="23">not a separate adapter class.</tspan></text><rect x="44" y="790" width="360" height="210" rx="9" fill="#e8f5ee" stroke="#24704a" stroke-width="2"/><text x="62" y="820" class="heading"><tspan x="62" dy="0">sources.py</tspan></text><text x="62" y="855" class="body"><tspan x="62" dy="0">Role allowlist and validation.</tspan><tspan x="62" dy="23">JSON files; lead aggregation.</tspan><tspan x="62" dy="23">No vector database or HR reader.</tspan></text><rect x="500" y="790" width="390" height="210" rx="9" fill="#eaf2ff" stroke="#2458a6" stroke-width="2"/><text x="518" y="820" class="heading"><tspan x="518" dy="0">workflows.py</tspan></text><text x="518" y="855" class="body"><tspan x="518" dy="0">marketing(), support(),</tspan><tspan x="518" dy="23">product(), tech().</tspan><tspan x="518" dy="23">Rules, evidence, drafts/proposals.</tspan></text><rect x="1020" y="790" width="335" height="210" rx="9" fill="#f2eaff" stroke="#7040a0" stroke-width="2"/><text x="1038" y="820" class="heading"><tspan x="1038" dy="0">model.py</tspan></text><text x="1038" y="855" class="body"><tspan x="1038" dy="0">interpret(), grounded_draft().</tspan><tspan x="1038" dy="23">Model protocol, LocalModel,</tspan><tspan x="1038" dy="23">Output validation; real</tspan><tspan x="1038" dy="23">inference.</tspan></text><polyline points="404,255 465,255 465,570 500,570" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="695,360 695,455" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="500,565 404,565" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="890,570 1020,570" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="695,685 695,790" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="500,895 404,895" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="890,895 1020,895" fill="none" stroke="#566272" stroke-width="2"  marker-end="url(#arrow)"/><text x="44" y="1040" class="small"><tspan x="44" dy="0">Arrows show principal usage, not every import. demo.py captures real-model evidence. All actions are local mocks.</tspan></text><rect x="44" y="1065" width="12" height="12" fill="#eaf2ff" stroke="#2458a6"/><text x="63" y="1077" class="small"><tspan x="63" dy="0">Code / fixed rules</tspan></text><rect x="262" y="1065" width="12" height="12" fill="#f2eaff" stroke="#7040a0"/><text x="281" y="1077" class="small"><tspan x="281" dy="0">Local model</tspan></text><rect x="480" y="1065" width="12" height="12" fill="#fff4da" stroke="#865b08"/><text x="499" y="1077" class="small"><tspan x="499" dy="0">Text heuristics</tspan></text><rect x="698" y="1065" width="12" height="12" fill="#e8f5ee" stroke="#24704a"/><text x="717" y="1077" class="small"><tspan x="717" dy="0">Stored / calculated</tspan></text><rect x="916" y="1065" width="12" height="12" fill="#ffebed" stroke="#a3252b"/><text x="935" y="1077" class="small"><tspan x="935" dy="0">Denied / error</tspan></text><rect x="1134" y="1065" width="12" height="12" fill="#f1f3f5" stroke="#596574"/><text x="1153" y="1077" class="small"><tspan x="1153" dy="0">Actor / external</tspan></text><text x="44" y="1110" class="small"><tspan x="44" dy="0">Current implementation, October 5. Mock actions only. Arrows mean the relationship stated on this page, not autonomous tool use.</tspan></text></svg>